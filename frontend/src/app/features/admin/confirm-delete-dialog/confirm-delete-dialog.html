<h2 mat-dialog-title>

  <mat-icon color="warn">
    warning
  </mat-icon>

  {{ data.title }}

</h2>

<mat-dialog-content>

  <p>{{ data.message }}</p>

  <p class="warning-text">
    Esta acción no se puede deshacer.
  </p>

</mat-dialog-content>

<mat-dialog-actions align="end">

<button
  mat-button
  type="button"
  [mat-dialog-close]="false"
>
  Cancelar
</button>

<button
  mat-flat-button
  color="warn"
  type="button"
  [mat-dialog-close]="true"
>
  <mat-icon>delete</mat-icon>
  Eliminar
</button>

</mat-dialog-actions>
